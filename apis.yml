aid: aeronext
name: Aeronext
description: Aeronext Inc. (株式会社エアロネクスト) is a Tokyo-based industrial drone technology startup, founded
  April 2017 by Keisuke Toji in Ebisu-Nishi, Shibuya-ku. Its core product is 4D GRAVITY(R), a patented
  airframe design that separates the flight unit from the payload unit and actively controls the center
  of gravity, improving stability, flight efficiency and payload performance. Aeronext monetizes through
  technology licensing and joint development — the Next-series airframes (AirTruck, LogiAir, PD4B-M-AN
  with PRODRONE) are built by licensee manufacturers — rather than through software. Its subsidiary NEXT
  DELIVERY Inc. operates SkyHub(R), a drone-plus-ground smart logistics platform co-developed with Seino
  Holdings and deployed across Japanese municipalities, with the SkyHub TMS system and a SkyHub Provider
  License program. Aeronext publishes no public developer program, API reference or machine-readable API
  contract.
